name: Auto-refresh & build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'PROMPT.md'
      - 'RESEARCH.md'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-build
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh live deals and videos
        run: python scripts/refresh.py
        continue-on-error: true

      - name: Build site
        run: python scripts/build.py

      - name: Commit and push changes
        run: |
          git config user.name "mobile-deals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-refresh: deals, videos and pages ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 && echo "Pages build requested" || echo "Pages not enabled yet; skipped"
